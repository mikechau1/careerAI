[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillpath"
version = "0.1.0"
description = "SkillPath AI: an agentic hybrid recommender for career and learning recommendations (CMPE 256)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
